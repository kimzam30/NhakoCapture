<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="NhakoCapture">
  <!-- NhakoCapture app icon.
       A butterfly caught in a capture frame: the Nhako family's butterfly
       (NhakoSearch, NeraOS) inside the one symbol everyone reads as
       "select an area". Pink and lavender are the family's two hues; the plum
       ink is NhakoSearch's line colour. Master artwork for tools/make-icons.py. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE1F1"/>
      <stop offset=".55" stop-color="#F6D3F4"/>
      <stop offset="1" stop-color="#DCCBFB"/>
    </linearGradient>
    <radialGradient id="sheen" cx=".3" cy=".08" r=".9">
      <stop offset="0" stop-color="#fff" stop-opacity=".85"/>
      <stop offset=".55" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wingTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFA9D6"/>
      <stop offset="1" stop-color="#F46FB4"/>
    </linearGradient>
    <linearGradient id="wingLow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#CDB6FA"/>
      <stop offset="1" stop-color="#A184EE"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5A2150"/>
      <stop offset="1" stop-color="#3A1236"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#6B2A63" flood-opacity=".18"/>
    </filter>
    <clipPath id="squircle">
      <path id="shape" d="M324 0H700C940 0 1024 84 1024 324V700C1024 940 940 1024 700 1024H324C84 1024 0 940 0 700V324C0 84 84 0 324 0Z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <rect width="1024" height="1024" fill="url(#tile)"/>
    <rect width="1024" height="1024" fill="url(#sheen)"/>
    <!-- NeraOS boot-bar tape, stuck across the corner by hand -->
    <g transform="rotate(42 868 156)">
      <clipPath id="tapeClip"><rect x="708" y="120" width="320" height="72" rx="6"/></clipPath>
      <g clip-path="url(#tapeClip)" opacity=".9">
        <rect x="708" y="120" width="320" height="72" fill="#F49AC1"/>
        <path d="M740 120h32v72h-32zM804 120h32v72h-32zM868 120h32v72h-32zM932 120h32v72h-32zM996 120h32v72h-32z" fill="#C3A6F0"/>
      </g>
    </g>
  </g>

  <!-- capture frame -->
  <g fill="none" stroke="url(#ink)" stroke-width="58" stroke-linecap="round" stroke-linejoin="round" filter="url(#lift)">
    <path d="M196 356V262a66 66 0 0 1 66-66h94"/>
    <path d="M668 196h94a66 66 0 0 1 66 66v94"/>
    <path d="M828 668v94a66 66 0 0 1-66 66h-94"/>
    <path d="M356 828h-94a66 66 0 0 1-66-66v-94"/>
  </g>

  <!-- butterfly -->
  <g filter="url(#lift)">
    <g id="half" stroke="#4A1942" stroke-width="22" stroke-linejoin="round">
      <path d="M530 522C556 432 630 350 694 356C756 362 760 444 712 494C674 534 602 544 532 540Z" fill="url(#wingTop)"/>
      <path d="M530 552C598 552 656 580 660 628C664 676 616 700 580 680C546 660 530 612 530 552Z" fill="url(#wingLow)"/>
      <circle cx="668" cy="420" r="21" fill="#fff" stroke="none"/>
      <circle cx="616" cy="638" r="14" fill="#fff" stroke="none"/>
      <path d="M518 446C522 408 534 382 556 366" fill="none" stroke-linecap="round" stroke-width="16"/>
      <circle cx="560" cy="362" r="13" fill="#4A1942" stroke="none"/>
    </g>
    <use href="#half" transform="translate(1024 0) scale(-1 1)"/>
    <rect x="494" y="438" width="36" height="236" rx="18" fill="#4A1942"/>
  </g>

  <!-- shutter glint -->
  <path d="M790 404l12 30 30 12-30 12-12 30-12-30-30-12 30-12z" fill="#fff" opacity=".95"/>
</svg>
