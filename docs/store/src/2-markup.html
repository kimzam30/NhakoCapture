<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Store 2 Markup</title>
<link rel="stylesheet" href="store.css">
<style>
  html, body { width: 1280px; height: 800px; }
  .copy { position: absolute; left: 64px; top: 150px; width: 360px; }
  h1 { margin-top: 14px; font-size: 54px; }
  .sub { margin-top: 20px; font-size: 19px; }
  .chips { margin-top: 28px; }
  .window { left: 470px; top: 120px; width: 930px; }
</style></head><body>
<div class="glow"></div>
<img class="fly" src="butterfly.svg" style="left:300px;top:640px;width:46px;transform:rotate(-12deg)">
<div class="copy">
  <span class="kicker">MARK IT UP</span>
  <h1>Draw right <span class="grad">on the page.</span></h1>
  <p class="sub">No new tab, no separate editor. Point at things, label them, highlight what matters. Every mark can be undone.</p>
  <div class="chips"><span class="chip">Pen</span><span class="chip">Arrow</span><span class="chip">Highlighter</span><span class="chip">Text</span><span class="chip">Blur</span><span class="chip">Magnifier</span><span class="chip">7 colours</span><span class="chip">Undo &amp; redo</span></div>
</div>
<div class="window">
  <div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span>
    <div class="url">🔒 meridian.example</div></div>
  <img class="shot" src="../raw/markup.png" alt="">
</div>
</body></html>
