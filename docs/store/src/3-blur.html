<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Store 3 Blur</title>
<link rel="stylesheet" href="store.css">
<style>
  html, body { width: 1280px; height: 800px; }
  .copy { position: absolute; right: 64px; top: 168px; width: 380px; }
  h1 { margin-top: 14px; font-size: 54px; }
  .sub { margin-top: 20px; font-size: 19px; }
  .note { margin-top: 26px; display: flex; gap: 12px; align-items: flex-start; font-size: 16px; color: var(--plum); line-height: 1.4;
          background: #fff; border-radius: 14px; padding: 14px 16px; box-shadow: 0 0 0 1px rgba(74,25,66,.10), 0 10px 24px -14px rgba(74,25,66,.35); }
  .note b { font-size: 20px; line-height: 1; }
  .window { left: 40px; top: 150px; width: 760px; }
</style></head><body>
<div class="glow"></div>
<img class="fly" src="butterfly.svg" style="left:1150px;top:80px;width:46px;transform:rotate(12deg)">
<div class="window">
  <div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span>
    <div class="url">🔒 northwind.example/billing</div></div>
  <img class="shot" src="../raw/blur.png" alt="">
</div>
<div class="copy">
  <span class="kicker">PRIVATE DETAILS</span>
  <h1>Blur that <span class="grad">really hides.</span></h1>
  <p class="sub">Drag over an email, a card number or a name. The pixels are replaced, not covered, so nobody can un-blur the image you share.</p>
  <div class="note"><b>✓</b><span>Not a see-through box. The original pixels are gone from the file.</span></div>
</div>
</body></html>
