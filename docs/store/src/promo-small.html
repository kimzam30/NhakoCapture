<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Store promo small</title>
<link rel="stylesheet" href="store.css">
<style>
  html, body { width: 440px; height: 280px; }
  .grid-bg { background-size: 20px 20px; }
  .wrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .wrap .mascot { width: 96px; height: 96px; margin-top: -6px; }
  .name { margin-top: 16px; font-family: "Pixelify Sans", monospace; font-size: 36px; font-weight: 600; line-height: 1; }
  .tag { margin-top: 10px; font-size: 16px; font-weight: 700; color: var(--plum); }
  .tag span { background: var(--plum); color: var(--cream); padding: 2px 6px; }
</style></head><body class="on-orange">
<div class="grid-bg"></div>
<i class="spark l" style="left:40px;top:40px;--c:#fff"></i>
<i class="spark s" style="left:96px;top:96px;--c:var(--yellow)"></i>
<i class="spark xl" style="left:356px;top:28px;--c:var(--lilac)"></i>
<i class="spark" style="left:388px;top:236px;--c:#fff"></i>
<i class="bit" style="left:30px;top:252px;--c:var(--plum)"></i>
<div class="wrap">
  <img class="mascot" src="../../brand/logo-512.png" alt="">
  <div class="name">NhakoCapture</div>
  <div class="tag">Screenshot anything. <span>Never leave the tab.</span></div>
</div>
</body></html>
