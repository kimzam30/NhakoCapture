<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nhako Capture</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #161616;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "Helvetica Neue", Arial, sans-serif;
    color: #f2f2f2;
  }
  /* Shown only if the capture never arrives. */
  #empty {
    display: none;
    position: absolute;
    inset: 0;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 8px;
    font-size: 14px;
    color: rgba(255, 255, 255, 0.62);
    text-align: center;
    padding: 32px;
  }
  #empty b { color: #f2f2f2; font-size: 15px; }
</style>
</head>
<body>
  <div id="empty">
    <b>Nothing to edit</b>
    <span>The capture did not arrive, or this window was reopened later.</span>
  </div>

  <!--
    Loaded in the same order background.js injects them into a page. This window
    exists for brave:// and Web Store pages, where extensions cannot inject a
    content script at all -- so the identical toolset is brought here instead of
    the page.
  -->
  <script src="../lib/namespace.js"></script>
  <script src="../lib/geometry.js"></script>
  <script src="../engine/ops.js"></script>
  <script src="../engine/render.js"></script>
  <script src="../overlay/stage.js"></script>
  <script src="../overlay/selection.js"></script>
  <script src="../overlay/annotate.js"></script>
  <script src="../overlay/rail.js"></script>
  <script src="../overlay/toolbar.js"></script>
  <script src="editor.js"></script>
</body>
</html>
